<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calculus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="boot">
  <div>
    <div class="mark" style="width:44px;height:44px;font-size:23px;margin:0 auto">&#8747;</div>
    <p id="bootmsg">Loading&hellip;</p>
  </div>
</div>

<header id="top">
  <button class="iconbtn" id="railbtn" title="Hide sidebar  (Cmd-B)" aria-label="Toggle sidebar">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
  </button>
  <div class="brand"><div class="mark">&#8747;</div><div><b>Calculus</b><span>Block 6</span></div></div>

  <div id="searchwrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" placeholder="Search every lesson&hellip;" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
    <div id="results"></div>
  </div>

  <div class="spacer">
    <span class="pillstat" id="netpill"><span class="dot"></span><span id="nettext">Checking&hellip;</span></span>
    <button class="iconbtn" id="helpbtn" title="Keyboard shortcuts" style="font-weight:600">?</button>
  </div>
</header>

<div id="main">
  <nav id="rail">
    <div id="railtop"><div id="wide"></div><div id="slim"></div></div>
    <div id="railfoot">
      <button class="btn" id="savebtn"></button>
    </div>
  </nav>

  <main id="reader">
    <div id="dochead"></div>
    <div id="frames"></div>
    <div id="pane" hidden></div>
    <div id="fsbar"><div class="wrap"><span id="fsbtns"></span><span style="width:1px;height:20px;background:var(--line);margin:0 4px"></span><span style="font-size:11px;color:var(--ink-4);white-space:nowrap"><kbd>esc</kbd> exit</span></div></div>
  </main>
</div>

<div id="tip"></div>

<div class="scrim" id="help">
  <div class="card">
    <h3>Keyboard shortcuts</h3>
    <div id="keys"></div>
  </div>
</div>

<div id="toast"><span id="toastmsg"></span><button id="toastbtn">Reload</button></div>

<script src="app.js"></script>
</body>
</html>
